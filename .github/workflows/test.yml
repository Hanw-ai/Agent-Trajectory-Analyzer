name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate Python syntax
        run: |
          python -m compileall src test demo.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest test -v

      - name: Run offline evaluation
        env:
          PYTHONPATH: .
        run: |
          python demo.py
